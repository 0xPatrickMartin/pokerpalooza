# The nginx inside the pokerpalooza container. A reverse proxy in front (e.g. nginx-proxy with
# acme-companion) handles the domain name and HTTPS, then forwards visitors here.
server_tokens off;

# http or https, as the visitor used it; the proxy reports it in X-Forwarded-Proto.
map $http_x_forwarded_proto $visitor_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
    # Some proxies forward requests as HTTP/1.0, which nginx won't compress for by default.
    gzip_http_version 1.0;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built files get a new name whenever they change (index-DyQ5Zc87.js), so browsers can keep them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html keeps its name across deploys; browsers must re-check it to pick up a new version.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

# www.example.com -> example.com. The app saves games and chip photos per web address,
# so everyone should land on the same one.
server {
    listen 80;
    server_name ~^www\.(?<bare_domain>.+)$;
    return 301 $visitor_scheme://$bare_domain$request_uri;
}
