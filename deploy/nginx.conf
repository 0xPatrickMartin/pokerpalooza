# The nginx inside the pokerpalooza container. It only hands out the app's files;
# your main nginx container handles d0cksey.com and HTTPS, then forwards visitors here.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
    # The main nginx forwards requests as HTTP/1.0, which nginx won't compress for by default.
    gzip_http_version 1.0;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built files get a new name whenever they change (index-DyQ5Zc87.js), so browsers can keep them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html keeps its name across deploys; browsers must re-check it to pick up a new version.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
