# STEP 1 (before d0cksey.com has a certificate): plain http, so Let's Encrypt can verify the domain.
# Put this next to your other sites' .conf files in your main nginx container, test, and reload.
server {
    listen 80;
    server_name d0cksey.com www.d0cksey.com;

    # Use the same folder your other sites use for certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Resolved per request (127.0.0.11 is Docker's DNS) so nginx still starts if pokerpalooza is down.
        resolver 127.0.0.11 valid=30s;
        set $pokerpalooza http://pokerpalooza:80;
        proxy_pass $pokerpalooza;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
