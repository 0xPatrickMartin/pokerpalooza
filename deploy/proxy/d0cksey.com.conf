# STEP 2 (once certbot has made /etc/letsencrypt/live/d0cksey.com/): replace the step 1 file with this one.
# If your other sites' configs have extra ssl_* or include lines, copy those in here too.

server {
    listen 80;
    server_name d0cksey.com www.d0cksey.com;

    # Use the same folder your other sites use for certbot, so renewals keep working.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://d0cksey.com$request_uri;
    }
}

# One address for everyone: the app saves games and chip photos per web address.
server {
    listen 443 ssl;
    server_name www.d0cksey.com;

    ssl_certificate     /etc/letsencrypt/live/d0cksey.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/d0cksey.com/privkey.pem;

    return 301 https://d0cksey.com$request_uri;
}

server {
    listen 443 ssl;
    server_name d0cksey.com;

    ssl_certificate     /etc/letsencrypt/live/d0cksey.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/d0cksey.com/privkey.pem;

    location / {
        # Resolved per request (127.0.0.11 is Docker's DNS) so nginx still starts if pokerpalooza is down.
        resolver 127.0.0.11 valid=30s;
        set $pokerpalooza http://pokerpalooza:80;
        proxy_pass $pokerpalooza;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
